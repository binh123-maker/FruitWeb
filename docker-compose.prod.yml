services:
  postgres:
    image: postgres:16-alpine
    container_name: fruitweb_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - fruitweb_pgdata:/var/lib/postgresql/data
    networks:
      - fruitweb_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: binh9325/fruitweb-backend:latest
    container_name: fruitweb_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - fruitweb_net

  frontend:
    image: binh9325/fruitweb-frontend:latest
    container_name: fruitweb_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - fruitweb_net

volumes:
  fruitweb_pgdata:

networks:
  fruitweb_net:
    driver: bridge
