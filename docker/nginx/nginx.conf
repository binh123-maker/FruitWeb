server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS resolver: Sử dụng biến để Nginx phân giải hostname lúc runtime thay vì crash lúc khởi động
    resolver 127.0.0.11 8.8.8.8 valid=30s ipv6=off;
    set $backend_upstream "http://backend:8000";

    # Swagger documentation
    location = /docs {
        proxy_pass $backend_upstream/docs;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI schema used by Swagger UI
    location = /openapi.json {
        proxy_pass $backend_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy API requests to backend service
    location /api {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for frontend routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}