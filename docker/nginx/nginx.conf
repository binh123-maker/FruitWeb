# ====================================================================
# FruitWeb - Nginx Security & Reverse Proxy Configuration
# ====================================================================

# Rate limiting zones (chống DoS / brute-force tấn công API)
limit_req_zone $binary_remote_addr zone=fruit_api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=fruit_auth_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Ẩn thông tin phiên bản Nginx để chống trinh sát lỗ hổng
    server_tokens off;

    # 2. Bảo mật HTTP Headers chuẩn OWASP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://images.unsplash.com https://upload.wikimedia.org https://*.unsplash.com; connect-src 'self' http: https:; frame-ancestors 'self';" always;

    # 3. Hỗ trợ xác thực Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # DNS resolver: Docker embedded DNS
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend_upstream "http://backend:8000";

    # Giới hạn kích thước body upload tránh làm tràn bộ nhớ server
    client_max_body_size 10M;

    # 4. Bảo vệ & Proxy Swagger documentation
    location = /docs {
        proxy_pass $backend_upstream/docs;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OpenAPI schema used by Swagger UI
    location = /openapi.json {
        proxy_pass $backend_upstream/openapi.json;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Giới hạn brute-force cho các endpoint Auth nhạy cảm (login/register)
    location ~* ^/api/(auth|users/login|users/register) {
        limit_req zone=fruit_auth_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 6. Reverse proxy API requests với Rate Limiting
    location /api {
        limit_req zone=fruit_api_limit burst=30 nodelay;
        limit_req_status 429;

        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # 7. Static Asset Caching để tăng tốc độ và giảm tải server
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    # 8. SPA fallback for frontend routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}