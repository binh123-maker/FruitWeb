server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Giao diện Swagger / OpenAPI không khả dụng khi chạy frontend độc lập
    location = /docs {
        default_type text/html;
        return 200 '<html><head><meta charset="utf-8"><title>FruitWeb Frontend Standalone</title></head><body style="font-family:sans-serif;padding:40px;line-height:1.6"><h2>FruitWeb Frontend Standalone Demo</h2><p>Tài liệu Swagger API không khả dụng ở chế độ frontend độc lập (Standalone Demo) vì dịch vụ Backend không khởi chạy.</p><p><a href="/">Quay về trang chủ giao diện FruitWeb</a></p></body></html>';
    }

    location = /openapi.json {
        default_type application/json;
        return 404 '{"error": "OpenAPI schema unavailable in standalone frontend mode"}';
    }

    # API endpoints phản hồi thông báo rõ ràng khi ở chế độ frontend độc lập
    location /api/ {
        default_type application/json;
        return 503 '{"error": "Backend service is not running in standalone frontend demo mode", "mode": "standalone_mock"}';
    }

    # SPA fallback for frontend routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
