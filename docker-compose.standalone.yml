services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.standalone
    container_name: fruitweb-frontend-demo
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
